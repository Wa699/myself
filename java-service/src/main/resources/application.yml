server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:3306/resume_agent?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:resume123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

python:
  service:
    url: ${PYTHON_SERVICE_URL:http://python-service:8000}

resume:
  rate-limit:
    max-requests-per-minute: 20
    max-question-length: 500
