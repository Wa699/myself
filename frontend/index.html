<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>简历问答</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #f0f2f8 0%, #e8ecf5 30%, #f5f7fb 60%, #edf0f7 100%);
      background-attachment: fixed;
      color: #2c3e50;
      min-height: 100vh;
    }
    /* 自定义滚动条 */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #ccd4e0; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #aab4c4; }
    /* 选中文字 */
    ::selection { background: #d4d9ff; color: #2c3e50; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
