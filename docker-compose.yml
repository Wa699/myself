services:
  mysql:
    image: mysql:8.0
    container_name: resume-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: resume_agent
    volumes:
      - ./sql:/docker-entrypoint-initdb.d
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - resume-net

  chroma:
    image: chromadb/chroma:latest
    container_name: resume-chroma
    restart: unless-stopped
    # 内部服务，不暴露公网端口
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - resume-net

  python-service:
    build: ./python-service
    container_name: resume-python
    restart: unless-stopped
    # 内部服务，不暴露公网端口（仅通过 Docker 内部网络访问）
    environment:
      PRIMARY_MODEL: ${PRIMARY_MODEL:-deepseek-chat}
      FALLBACK_MODEL: ${FALLBACK_MODEL:-qwen-turbo}
      PRIMARY_API_KEY: ${PRIMARY_API_KEY}
      FALLBACK_API_KEY: ${FALLBACK_API_KEY:-}
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
      SIMILARITY_THRESHOLD: ${SIMILARITY_THRESHOLD:-0.0}
    volumes:
      - chroma_model_cache:/root/.cache/chroma
      - ./resumes:/app/resumes
    depends_on:
      mysql:
        condition: service_healthy
      chroma:
        condition: service_started
    networks:
      - resume-net

  java-service:
    build: ./java-service
    container_name: resume-java
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PYTHON_SERVICE_URL: http://python-service:8000
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: resume_agent
    depends_on:
      - python-service
    networks:
      - resume-net

  frontend:
    image: nginx:alpine
    container_name: resume-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - java-service
    networks:
      - resume-net

volumes:
  chroma_model_cache:
  chroma_data:
  mysql_data:

networks:
  resume-net:
    driver: bridge